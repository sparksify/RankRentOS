name: Load pipeline output into Supabase

on:
  workflow_dispatch:
  push:
    branches: ['claude/**', main]
    paths: ['app/data-snapshot/**', 'scripts/load-db.mjs']

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Load db-rows snapshots into Supabase (idempotent)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/load-db.mjs
